<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VRスマート農業体験 - Quest & iPad対応版</title>
  <!-- 安定性の高い A-Frame 1.5.0 本体のみを読み込み（外部プラグイン不使用） -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    window.harvestScore = 0;

    AFRAME.registerComponent('crop-spot', {
      schema: {
        stage: {type: 'int', default: 0}
      },
      init: function () {
        const el = this.el;
        
        // 茎
        this.stem = document.createElement('a-cylinder');
        this.stem.setAttribute('color', '#2e7d32');
        this.stem.setAttribute('radius', '0.025');
        this.stem.setAttribute('visible', 'false');
        el.appendChild(this.stem);

        // 葉
        this.leaves = document.createElement('a-cone');
        this.leaves.setAttribute('color', '#4caf50');
        this.leaves.setAttribute('visible', 'false');
        el.appendChild(this.leaves);

        // 実（トマト）
        this.fruit = document.createElement('a-sphere');
        this.fruit.setAttribute('radius', '0.07');
        this.fruit.setAttribute('visible', 'false');
        el.appendChild(this.fruit);

        // ガイドテキスト
        this.label = document.createElement('a-text');
        this.label.setAttribute('value', 'Tap: Plant');
        this.label.setAttribute('align', 'center');
        this.label.setAttribute('position', '0 0.45 0');
        this.label.setAttribute('scale', '0.45 0.45 0.45');
        this.label.setAttribute('color', '#ffffff');
        el.appendChild(this.label);

        // iPadのタッチとQuestのトリガーの二重発火（チャタリング）防止用タイマー
        this.lastClickTime = 0;

        el.addEventListener('click', () => {
          const now = Date.now();
          if (now - this.lastClickTime < 300) return; // 0.3秒以内の連続反応を無視
          this.lastClickTime = now;

          let s = (this.data.stage + 1) % 4;
          this.data.stage = s;
          this.updateVisuals(s);
        });
      },

      updateVisuals: function (stage) {
        const scoreBoard = document.querySelector('#score-text');
        const statusBoard = document.querySelector('#action-log');

        if (stage === 0) {
          window.harvestScore += 1;
          scoreBoard.setAttribute('value', 'Harvested: ' + window.harvestScore + ' pcs');
          statusBoard.setAttribute('value', 'Status: Harvested crisp tomatoes!');
          
          this.stem.setAttribute('visible', 'false');
          this.leaves.setAttribute('visible', 'false');
          this.fruit.setAttribute('visible', 'false');
          this.label.setAttribute('value', 'Tap: Plant');
          this.label.setAttribute('position', '0 0.45 0');
          this.label.setAttribute('color', '#ffffff');
        } 
        else if (stage === 1) {
          statusBoard.setAttribute('value', 'Status: Seed planted. Give water!');
          this.stem.setAttribute('visible', 'true');
          this.stem.setAttribute('height', '0.2');
          this.stem.setAttribute('position', '0 0.15 0');

          this.leaves.setAttribute('visible', 'true');
          this.leaves.setAttribute('radius-bottom', '0.12');
          this.leaves.setAttribute('height', '0.2');
          this.leaves.setAttribute('position', '0 0.25 0');

          this.label.setAttribute('value', 'Tap: Water');
          this.label.setAttribute('position', '0 0.55 0');
        } 
        else if (stage === 2) {
          statusBoard.setAttribute('value', 'Status: Growing well! Wait for ripening.');
          this.stem.setAttribute('height', '0.5');
          this.stem.setAttribute('position', '0 0.3 0');

          this.leaves.setAttribute('radius-bottom', '0.24');
          this.leaves.setAttribute('height', '0.45');
          this.leaves.setAttribute('position', '0 0.45 0');

          this.fruit.setAttribute('visible', 'true');
          this.fruit.setAttribute('color', '#8bc34a');
          this.fruit.setAttribute('position', '0.1 0.4 0.12');

          this.label.setAttribute('value', 'Tap: Ripen');
          this.label.setAttribute('position', '0 0.8 0');
        } 
        else if (stage === 3) {
          statusBoard.setAttribute('value', 'Status: Ripe and ready to harvest!');
          this.fruit.setAttribute('color', '#e53935');
          this.fruit.setAttribute('radius', '0.09');

          this.label.setAttribute('value', '[ READY! Tap to Harvest ]');
          this.label.setAttribute('color', '#ffeb3b');
        }
      }
    });
  </script>
</head>
<body>
  <!-- raycasterとcursorをシーン全体に設定することでiPadの画面直接タップに完全対応 -->
  <a-scene cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable">
    
    <!-- 空と地面（外部プラグインを使わず標準タグで高速描画） -->
    <a-sky color="#b3e5fc"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#558b2f"></a-plane>

    <!-- 照明 -->
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" color="#fff8e1" intensity="0.6" position="-2 4 2"></a-light>

    <!-- ビニールハウス -->
    <a-entity position="0 0 -1.8">
      <!-- ハウスのアーチ屋根 -->
      <a-cylinder position="0 2.2 0" radius="3.2" height="6" rotation="90 0 0" 
                  theta-start="90" theta-length="180" side="double" 
                  material="color: #ffffff; opacity: 0.3; transparent: true"></a-cylinder>
      
      <!-- ハウス内の通路（コンクリートの床） -->
      <a-plane position="0 0.01 0" rotation="-90 0 0" width="1.5" height="6" color="#90a4ae"></a-plane>

      <!-- スマート農業ダッシュボード -->
      <a-plane position="0 2.1 -2.8" width="3.2" height="1.3" color="#263238">
        <a-text value="=== Smart Greenhouse VR ===" align="center" position="0 0.4 0.02" width="4" color="#4dd0e1"></a-text>
        <a-text value="Temp: 25.4 C  |  Humidity: 62%  |  Lux: 38,000" align="center" position="0 0.15 0.02" width="3.2" color="#a5d6a7"></a-text>
        <a-text id="score-text" value="Harvested: 0 pcs" align="center" position="0 -0.12 0.02" width="5" color="#ffeb3b"></a-text>
        <a-text id="action-log" value="Status: Tap or click the brown soil pots!" align="center" position="0 -0.42 0.02" width="3.2" color="#ffffff"></a-text>
      </a-plane>

      <!-- 左の畝とポット -->
      <a-box position="-1.1 0.2 0" width="0.8" height="0.4" depth="4" color="#3e2723"></a-box>
      <a-cylinder class="clickable" crop-spot position="-1.1 0.45 -1.2" radius="0.26" height="0.1" color="#6d4c41"></a-cylinder>
      <a-cylinder class="clickable" crop-spot position="-1.1 0.45 0"    radius="0.26" height="0.1" color="#6d4c41"></a-cylinder>
      <a-cylinder class="clickable" crop-spot position="-1.1 0.45 1.2"  radius="0.26" height="0.1" color="#6d4c41"></a-cylinder>

      <!-- 右の畝とポット -->
      <a-box position="1.1 0.2 0" width="0.8" height="0.4" depth="4" color="#3e2723"></a-box>
      <a-cylinder class="clickable" crop-spot position="1.1 0.45 -1.2" radius="0.26" height="0.1" color="#6d4c41"></a-cylinder>
      <a-cylinder class="clickable" crop-spot position="1.1 0.45 0"    radius="0.26" height="0.1" color="#6d4c41"></a-cylinder>
      <a-cylinder class="clickable" crop-spot position="1.1 0.45 1.2"  radius="0.26" height="0.1" color="#6d4c41"></a-cylinder>
    </a-entity>

    <!-- プレイヤー視点 ＆ コントローラー -->
    <a-entity id="rig" position="0 0 1.5">
      <!-- iPadで見回しやすいようにカメラ角度を少し下向きに調整 -->
      <a-camera position="0 1.5 0" look-controls="touchEnabled: true"></a-camera>
      
      <!-- Quest 3S用レーザーコントローラー -->
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 10; lineColor: #4caf50"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 10; lineColor: #4caf50"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
