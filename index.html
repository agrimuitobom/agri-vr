<style>

  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a1d; font-family: var(--font); color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: none; }

  .seed { font-family: var(--font); border: 2px solid transparent; border-radius: 14px; padding: 7px 12px; background: var(--cream2); cursor: pointer; font-weight: 800; font-size: 13px; color: var(--ink); display: flex; align-items: center; gap: 6px; white-space: nowrap; }

  .btn.ghost { background: #efe4cf; color: var(--ink); box-shadow: 0 3px 0 #d6c8ad; }
  .btn.red { background: #c2462c; box-shadow: 0 3px 0 #8a2e1a; }
  .close-x { float: right; border: none; background: #efe4cf; border-radius: 10px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; font-family: var(--font); }
  .prog { height: 8px; border-radius: 6px; background: #efe4cf; overflow: hidden; margin-top: 6px; }

  .stats b { display: block; font-size: 18px; color: var(--ink); }

  #title { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 25%, rgba(20, 12, 4, .6) 100%); color: #fff; padding: 20px; }

  #title .btns { display: flex; flex-direction: column; gap: 12px; width: min(320px, 90vw); }
  #title .big { font-size: 18px; padding: 15px 20px; border-radius: 16px; }

  #loading { position: fixed; inset: 0; z-index: 40; background: #1b2a1d; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-weight: 800; transition: opacity .8s; }
  #loading .sprout { font-size: 56px; animation: bob 1.2s ease-in-out infinite; }
  #loading .err { max-width: 80vw; font-size: 12px; opacity: .8; font-weight: 500; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-6deg); } }
  #fade { position: fixed; inset: 0; z-index: 25; background: #000; opacity: 0; pointer-events: none; transition: opacity .7s; }

  @media (max-width: 760px) {
    .tool { width: 60px; height: 60px; border-radius: 15px; } .tool .em { font-size: 25px; } .tool .key { display: none; }
    #status { min-width: 0; padding: 8px 10px; } #money { font-size: 19px; }
    #guide { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 96px); } #guide .text { font-size: 13px; }
    #seedpick { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 92px); }
    .ibtn { padding: 9px 11px; } .ibtn .lbl { display: none; }
    #joy { bottom: calc(max(18px, env(safe-area-inset-bottom)) + 96px); width: 110px; height: 110px; }
  }
</style>
</head>

<script type="module">
import * as THREE from 'three';

// =====================================================================

//  - Three.js + WebXR（Meta Quest）/ タッチ（iPad）/ マウス・キーボード（PC）
//  - 外部アセット不要：モデル・テクスチャ・音はすべてコードで生成
// =====================================================================

// ---------- ユーティリティ ----------
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const yen = (n) => '¥' + Math.round(n).toLocaleString('ja-JP');
const mtof = (n) => 440 * Math.pow(2, (n - 69) / 12);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry32(20261017);            // 地形・配置用の固定乱数
const rr = (a, b) => a + R() * (b - a);
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
function fbm(x, y) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++) { s += a * noise2(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }
function loadJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode etc. */ } }

const UA = navigator.userAgent;
const IS_QUEST = /OculusBrowser|Quest|Pico/i.test(UA);
const IS_TOUCH = /iPad|iPhone|Android/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) || (matchMedia('(any-pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches);

const FONT = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Meiryo",sans-serif';

// ---------- ゲームデータ ----------

const GOAL_REP = 15;
const SPEEDS = [1, 3, 8];
const CROPS = {

    id: 'tomato', name: 'トマト', em: '🍅', seed: 200, hours: 20, price: 150, base: 5.0, yu: 6.6, shu: 8.0,
    water: 3.2, fruits: 6, careRate: 0.09, care: 'わき芽', careVerb: '✂️ わき芽を摘む', lv: 1, orderMin: 3, orderMax: 6,
    band: [40, 80], bandFruit: [25, 50],
    tip: '実が色づくころは水を控えめ(25〜50%)にすると甘くなる',
  },

    water: 2.6, fruits: 7, careRate: 0.08, care: 'ランナー', careVerb: '✂️ ランナーを摘む', lv: 2, orderMin: 4, orderMax: 7,
    band: [40, 80], bandFruit: [35, 70],
    tip: '肥料と日当たり、夜の涼しさで甘くなる',
  },

    id: 'watermelon', name: 'スイカ', em: '🍉', seed: 600, hours: 28, price: 1600, base: 9.0, yu: 10.6, shu: 11.6,
    water: 4.2, fruits: 1, careRate: 0.06, care: '子づる', careVerb: '✂️ 余分な子づるを摘む', lv: 3, orderMin: 1, orderMax: 2,
    band: [40, 80], bandFruit: [40, 75],

};
const CROP_IDS = Object.keys(CROPS);
const GRADES = { '良': { rank: 0, mult: 1.0, col: '#7c8a55' }, '優': { rank: 1, mult: 1.4, col: '#2f7fbf' }, '秀': { rank: 2, mult: 2.0, col: '#d4462c' } };
const gradeOf = (crop, brix) => brix >= CROPS[crop].shu ? '秀' : brix >= CROPS[crop].yu ? '優' : '良';
const LEVELS = [

  { id: 'compost', em: '🍂', name: '有機たい肥', price: 1200, desc: '肥料の減りが半分に。どの作物も少し甘くなる' },

const Flyers = {
  list: [],
  spawn(item, pos, scale, color, src) {
    const mat = FRUIT_MATS[item.crop].clone(); mat.color.copy(color);
    const mesh = new THREE.Mesh(FRUIT_GEO[item.crop], mat); mesh.scale.setScalar(scale); mesh.position.copy(pos); mesh.castShadow = true; scene.add(mesh);

    if (src && src.grip) { f.held = src; src.held = f; }

    this.list.push(f);
    AudioSys.play('whoosh');
  },
  aim(f) {
    const tgt = _v1.set(CRATE.x + rand(-0.2, 0.2), 0.32, CRATE.z + rand(-0.15, 0.15));
    const T = 0.75 + f.pos.distanceTo(tgt) * 0.04;
    f.vel.copy(tgt).sub(f.pos).divideScalar(T); f.vel.y += 0.5 * 9.8 * T;
  },
  release(f, vel) { f.held = null; f.vel.copy(vel).multiplyScalar(1.25); f.thrown = true; f.age = 0; },
  inCrate(p) { return Math.abs(p.x - CRATE.x) < 0.5 && Math.abs(p.z - CRATE.z) < 0.36 && p.y < 0.55 && p.y > 0.08; },
  update(dt) {

      const f = this.list[i]; f.age += dt;
      if (f.held) { f.held.grip.getWorldPosition(f.pos); f.pos.add(_v1.set(0, -0.02, -0.06).applyQuaternion(f.held.grip.getWorldQuaternion(_q))); f.mesh.position.copy(f.pos); continue; }
      if (f.home) { // ふわっと出荷箱へ
        f.home.t += dt / 0.9; const t = Math.min(1, f.home.t);
        f.mesh.position.lerpVectors(f.home.a, f.home.b, t); f.mesh.position.y += Math.sin(t * Math.PI) * 1.2;
        if (Math.random() < 0.5) GLOW.emit(f.mesh.position, _v2.set(0, 0.2, 0), '#fff2b0', 0.04, 0.5, 0, 1, 2);

      if (f.vel.y < 0 && this.inCrate(f.pos)) { this.land(f, f.thrown); this.list.splice(i, 1); continue; }
      if (f.pos.y < f.r * 0.8) {

    }
  },
  land(f, nice) {
    const m = f.mesh; m.position.set(CRATE.x + rand(-0.4, 0.4), 0.22 + Math.min(cratePile.length, 16) * 0.012, CRATE.z + rand(-0.28, 0.28)); m.rotation.set(rand(0, 6), rand(0, 6), rand(0, 6));
    cratePile.push(m); if (cratePile.length > 24) { const o = cratePile.shift(); scene.remove(o); o.material.dispose(); }

  },
